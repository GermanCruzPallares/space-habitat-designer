<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Three.js GLB Loader</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
  // Renderer
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  // Scene y cámara
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0a);

  const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.set(3, 2, 5);

  // Controles
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // Luces
  const ambient = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(5, 10, 7);
  scene.add(dirLight);

  // Loader GLB
  const loader = new GLTFLoader();
  loader.load(
    './models/ModeloDePrueba.glb', // Modelo dentro de la carpeta models
    (gltf) => {
      const planeGeometry = new THREE.PlaneGeometry(10, 10); // tamaño de la superficie
    const planeMaterial = new THREE.MeshStandardMaterial({ color: 0x555555, side: THREE.DoubleSide });
    const plane = new THREE.Mesh(planeGeometry, planeMaterial);
    plane.rotation.x = - Math.PI / 2; // rotar para que quede horizontal
        plane.position.y = 0; // altura del plano
scene.add(plane);
      const model = gltf.scene;
      model.position.set(0, 0, 0);
      scene.add(model);
      console.log('Modelo cargado', gltf);
    },
    (xhr) => {
      console.log(`${((xhr.loaded / xhr.total) * 100).toFixed(2)}% cargado`);
    },
    (error) => {
      console.error('Error cargando el modelo:', error);
    }
  );

  // Animación
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // Resize
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
