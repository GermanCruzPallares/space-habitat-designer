<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Hackathon - Three.js Models</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif;
        }
        #container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
        }
        #loading {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="loading">Cargando modelos...</div>
    </div>

    <!-- Importar usando módulos ES6 -->
    <script type="module">
        // Importar Three.js y los componentes necesarios desde CDN
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.module.js';
        import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.132.2/examples/jsm/loaders/GLTFLoader.js';
        import { DragControls } from 'https://cdn.jsdelivr.net/npm/three@0.132.2/examples/jsm/controls/DragControls.js';
        
        // Importar nuestro script principal
        import './script.js';
    </script>
</body>
</html>
